name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobmail
          POSTGRES_PASSWORD: jobmail
          POSTGRES_DB: jobmail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobmail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://jobmail:jobmail@localhost:5432/jobmail_test' || 'sqlite:///:memory:' }}
        run: python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobmail:ci .

  deploy:
    name: Deploy to Render
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Trigger deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set - skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered."
      - name: Wait for the new version to be healthy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then exit 0; fi
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/healthz" | grep -q '"ok"'; then
              echo "Healthy: $APP_URL"; exit 0
            fi
            echo "Waiting for $APP_URL/healthz ($i/30)..."; sleep 10
          done
          echo "::error::App did not become healthy after deploy"; exit 1
